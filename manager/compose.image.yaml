services:
  manager:
    image: ${JIAYIN_MANAGER_IMAGE:-jiayin-manager:0.1-preview11}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8780:8780"
    environment:
      JIAYIN_MUSIC_ROOT: /music
      JIAYIN_DATA_ROOT: /data
      JIAYIN_ADMIN_PASSWORD: ${JIAYIN_ADMIN_PASSWORD:?Set your unique initial password}
      JIAYIN_PUBLIC_ORIGIN: ${JIAYIN_PUBLIC_ORIGIN:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - "${MUSIC_PATH:?Set your music directory}:/music"
      - "${DATA_PATH:?Set a separate data directory}:/data"
    security_opt:
      - no-new-privileges:true
