name: Android and library manager checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: manager/requirements*.txt
      - name: Install test dependencies
        timeout-minutes: 8
        run: |
          # The hosted runner's Azure mirror can stall large FFmpeg packages.
          # Keep signed Ubuntu packages, using the official archive instead.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          pip install -r manager/requirements-dev.txt
      - name: Test generated library and browser syntax
        run: |
          python -m pytest manager/tests -q --junitxml=manager-results.xml
          node --input-type=module --check < manager/jiayin_manager/static/app.js
          node --input-type=module --check < manager/jiayin_manager/static/corrections-ui.js
          node --experimental-vm-modules --test manager/tests/test_navigation.mjs
      - name: Build NAS container
        run: docker build -t jiayin-manager:ci manager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-test-results
          path: manager-results.xml
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.1.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Check and build
        run: |
          chmod +x gradlew
          ./gradlew testDegoogledDebugUnitTest testTempusDebugUnitTest lintDegoogledRelease lintTempusRelease assembleDegoogledRelease assembleTempusRelease --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' --console=plain
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
